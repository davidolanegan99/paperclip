name: Build executable

# Produces a Paperclip executable per platform.
#
# Why this workflow exists: PyInstaller cannot cross-compile, so a Windows .exe
# must be built on a Windows runner. This lets you get paperclip.exe without
# owning a Windows machine -- trigger it and download the artifact.
#
# Usage:
#   Actions tab -> "Build executable" -> Run workflow
#   or:  gh workflow run build-exe.yml -f os=windows -f layout=onedir
#   or push a tag matching v* to build all platforms.

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target platform
        required: true
        type: choice
        options:
          - windows
          - ubuntu
          - macos
          - all
        default: windows
      layout:
        description: "onefile = single .exe; onedir = folder (far fewer AV false positives)"
        required: true
        type: choice
        options:
          - onefile
          - onedir
        default: onedir
      embed_node:
        description: Embed a portable Node runtime (target then needs no Node installed)
        required: true
        type: boolean
        default: false
      arch:
        description: Target architecture
        required: true
        type: choice
        options:
          - x64
          - arm64
        default: x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.event_name }}-${{ github.ref }}-${{ inputs.os || 'all' }}
  cancel-in-progress: true

env:
  # Keep in sync with packages/shared/src/node-version.ts (MINIMUM_NODE_VERSION).
  NODE_MAJOR: 24

jobs:
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          requested="${{ inputs.os || 'all' }}"
          case "$requested" in
            all)     matrix='["windows","ubuntu","macos"]' ;;
            windows) matrix='["windows"]' ;;
            ubuntu)  matrix='["ubuntu"]' ;;
            macos)   matrix='["macos"]' ;;
            *)       matrix='["windows"]' ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: resolve
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # python.org builds ship the shared library PyInstaller needs; Debian's
          # system Python does not.
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install workspace dependencies
        # No --no-optional: the @embedded-postgres/<platform> packages are
        # optionalDependencies, and skipping them breaks embedded Postgres.
        run: pnpm install --frozen-lockfile

      - name: Bundle the CLI (esbuild)
        run: pnpm --filter paperclipai build

      - name: Build the server and UI assets
        # Best-effort: the executable is useful for CLI/client work without these,
        # and a failure here should not block producing a runnable binary.
        continue-on-error: true
        run: pnpm --filter @paperclipai/server build

      - name: Verify the embedded Postgres native package is present
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "packaging/exe")
          from pathlib import Path
          from paperclip_exe._platform import current_platform
          from paperclip_exe.postgres import inspect, native_slug
          from paperclip_exe.staging import merge_trees

          plat = current_platform()
          slug = native_slug(plat)
          print(f"platform: {plat.os}/{plat.arch}  expected: @embedded-postgres/{slug}")
          if slug is None:
              print("no published build for this platform; embedded Postgres unavailable")
              sys.exit(0)

          roots = [p for p in (Path("cli/node_modules"), Path("node_modules")) if p.is_dir()]
          if not roots:
              print("::error::no node_modules to inspect")
              sys.exit(1)
          staged = Path("build/_pg_check")
          merge_trees(roots, staged)
          status = inspect(staged / "node_modules" if (staged / "node_modules").is_dir() else staged, plat)
          print(status.describe())
          for note in status.notes:
              print("  note:", note)
          sys.exit(0 if status.healthy else 1)
          PY

      - name: Build executable
        shell: bash
        run: |
          args=(--stage-payload --freeze --run-doctor --target-arch "${{ inputs.arch || 'x64' }}")
          if [ "${{ inputs.layout || 'onedir' }}" = "onedir" ]; then
            args+=(--onedir)
          fi
          if [ "${{ inputs.embed_node }}" = "true" ]; then
            args+=(--embed-node)
          fi
          python packaging/exe/build_exe.py "${args[@]}"

      - name: Self-check
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            name="paperclip.exe"
          else
            name="paperclip"
          fi
          if [ "${{ inputs.layout || 'onedir' }}" = "onedir" ]; then
            bin="packaging/exe/dist/paperclip/$name"
          else
            bin="packaging/exe/dist/$name"
          fi
          chmod +x "$bin" 2>/dev/null || true
          "$bin" --launcher-info
          "$bin" --launcher-doctor

      - name: Package artifact
        shell: bash
        run: |
          cd packaging/exe/dist
          if [ "${{ inputs.layout || 'onedir' }}" = "onedir" ]; then
            # Ship the whole onedir folder as a single archive.
            if command -v zip >/dev/null 2>&1; then
              zip -qry paperclip-${{ matrix.os }}.zip paperclip
            else
              tar -czf paperclip-${{ matrix.os }}.tar.gz paperclip
            fi
          fi
          for f in paperclip paperclip.exe paperclip-*.zip paperclip-*.tar.gz; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              shasum -a 256 "$f" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-${{ matrix.os }}-${{ inputs.arch || 'x64' }}-${{ inputs.layout || 'onedir' }}
          path: |
            packaging/exe/dist/paperclip
            packaging/exe/dist/paperclip.exe
            packaging/exe/dist/paperclip-*.zip
            packaging/exe/dist/paperclip-*.tar.gz
            packaging/exe/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # The packaging pipeline is pure Python and fast, so lint/test it on every run
  # -- a broken launcher is caught even when only one platform was requested.
  test-packaging:
    name: Test packaging pipeline
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging tests
        run: |
          cd packaging/exe
          python -m unittest discover -s tests -t . -v
      - name: Verify build_exe.py dry run
        run: python packaging/exe/build_exe.py --dry-run --all --skip-app-build --allow-missing-deps --allow-old-node
